<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>풍산고 설명회 원고</title>
<style>
  :root {
    --bg: #fdfcf8; --fg: #1d1d1f; --sub: #6b6b70; --accent: #c2410c;
    --card: #ffffff; --line: #e6e3da; --chip: #fff1e6; --slide: #1e3a8a; --slidebg: #e8eefc;
    --fs: 44px;
  }
  body.dark {
    --bg: #111214; --fg: #f2f2f2; --sub: #9a9aa2; --accent: #ffb37a;
    --card: #1b1c20; --line: #2c2d33; --chip: #3a2618; --slide: #a9c1ff; --slidebg: #1c2540;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--bg); color: var(--fg);
    font-family: "Pretendard", "Malgun Gothic", "Apple SD Gothic Neo", sans-serif;
    display: flex; flex-direction: column; overflow: hidden;
    -webkit-user-select: none; user-select: none;
  }
  header {
    display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
    padding: 10px 16px; border-bottom: 1px solid var(--line);
  }
  .sec {
    font-weight: 800; font-size: 22px; color: var(--accent);
    background: var(--chip); padding: 4px 14px; border-radius: 999px;
  }
  .slide {
    font-weight: 700; font-size: 20px; color: var(--slide);
    background: var(--slidebg); padding: 4px 14px; border-radius: 999px;
  }
  .count { color: var(--sub); font-size: 18px; font-variant-numeric: tabular-nums; }
  .spacer { flex: 1; }
  button {
    font: inherit; font-size: 16px; padding: 7px 12px; border-radius: 10px;
    border: 1px solid var(--line); background: var(--card); color: var(--fg); cursor: pointer;
  }
  button.on { background: var(--accent); color: var(--bg); border-color: var(--accent); }
  .progress { height: 5px; background: var(--line); }
  .progress > div { height: 100%; background: var(--accent); transition: width .25s; }
  main {
    flex: 1; overflow-y: auto; display: flex; justify-content: center;
    padding: 4vh 6vw;
  }
  .text {
    max-width: 1400px; width: 100%; margin: auto 0;
    font-size: var(--fs); line-height: 1.7; word-break: keep-all; letter-spacing: -0.01em;
  }
  .text p { margin: 0 0 0.6em; }
  .text b { color: var(--accent); }
  .text .cue { font-size: .6em; color: var(--slide); font-weight: 700; }
  /* 가리기 모드: 키워드만 보이고 나머지는 자리만 남김 */
  body.hide .text:not(.reveal) { color: transparent; }
  body.hide .text:not(.reveal) p { background-image: linear-gradient(var(--line), var(--line));
    background-size: 100% 0.15em; background-repeat: repeat-y; }
  body.hide .text:not(.reveal) b { color: var(--accent); }
  body.hide .text:not(.reveal) .cue { color: var(--slide); }
  .next {
    border-top: 1px solid var(--line); padding: 10px 16px; color: var(--sub);
    font-size: 20px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .next span { color: var(--accent); font-weight: 700; margin-right: 8px; }
  .next span.click { color: var(--slide); }
  /* 목차 */
  #toc {
    position: fixed; inset: 0; background: var(--bg); overflow-y: auto;
    padding: 20px 16px 40px; display: none; z-index: 10;
  }
  #toc.open { display: block; }
  #toc h2 { margin: 18px 0 8px; color: var(--accent); font-size: 22px; }
  #toc .item {
    display: block; width: 100%; text-align: left; margin: 6px 0; font-size: 18px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  #toc .item .n { color: var(--slide); font-weight: 700; margin-right: 6px; }
  #toc .item.cur { border-color: var(--accent); }
  .hint { color: var(--sub); font-size: 14px; }
  @media (max-width: 700px) {
    header { padding: 8px 12px; gap: 6px; }
    .sec, .slide { font-size: 15px; padding: 3px 10px; }
    main { padding: 3vh 16px; }
    .hint { display: none; }
    .next { font-size: 16px; }
  }
</style>
</head>
<body>
<header>
  <span class="sec" id="sec"></span>
  <span class="slide" id="slide"></span>
  <span class="count" id="count"></span>
  <span class="spacer"></span>
  <span class="hint">← → / 스페이스로 이동 · H 가리기 · 가리기 중 화면 누르고 있으면 보기</span>
  <button id="btnToc">목차</button>
  <button id="btnHide">가리기</button>
  <button id="btnSmall">가−</button>
  <button id="btnBig">가+</button>
  <button id="btnTheme">◐</button>
</header>
<div class="progress"><div id="bar"></div></div>
<main id="main"><div class="text" id="text"></div></main>
<div class="next" id="next"></div>

<div id="toc"></div>

  ["3. 진로진학 길찾기", 22, "꿈 프로젝트", `<p><b>1학년 꿈 세우기</b>에서는 학습코칭과 스쿨 멘토링 등으로 <b>나를 알아 가고</b>,</p>

  ["3. 진로진학 길찾기", 23, "컨설팅·특강·면접 지도", `<p>특히 <b>2, 3학년</b> 학생들을 위한 <b>일대일 진학 진로 컨설팅</b>은 아주 중요한 프로그램인데요, <b>상담 의뢰서</b>를 바탕으로 <b>학부모님과 함께</b>하는 1:1 진로진학 컨설팅을 받습니다.</p>

<p>그리고 <b>3학년</b>은 지원 대학과 학과에 맞춘 <b>1:1 면접 지도</b>까지 이어지고 있습니다.</p>`],

  ["4. 시설 및 분위기", 24, "공간", `<p>네 번째는 <b>시설과 분위기</b>입니다. 먼저 시설을 소개해드리겠습니다.</p>

  ["4. 시설 및 분위기", 24, "공간", `<p>먼저 <b>움직이는 공간</b>인 <b>체력단련실, 탁구장, 배구장, 농구장</b>이 학생들이 쉽게 사용할 수 있도록 굉장히 잘 되어 있습니다.</p>

  ["4. 시설 및 분위기", 25, "모두가 참여하는 분위기", `<p>이제 <b>오늘 가장 말씀드리고 싶은 부분</b>입니다. 지금까지 소개드린 활동과 시설이 있어도, <b>하지 않으면 의미가 없습니다.</b></p>

  ["4. 시설 및 분위기", 25, "모두가 참여하는 분위기", `<p><b>프로그램도 마찬가지</b>입니다. 어느 학교든 프로그램은 많이 마련해 둡니다.</p>

  ["4. 시설 및 분위기", 25, "모두가 참여하는 분위기", `<p>한번 해 보라고 이야기하면 <b>"해볼까요?"</b> 하면서 옆에 있는 친구에게 <b>"같이 하자"</b> 하고 바로 신청해서, 하나씩 해 보는 분위기입니다.</p>
<p><b>'하고 싶었는데 못 했다'</b>는 말이 나오면 마음이 아프긴 하잖아요, 근데 저희 학교 선생님들은 <b>모든 학생에게 기회</b>를 주려고 정말 많이 노력합니다.</p>`],
  ["4. 시설 및 분위기", 26, "8학급이라서 가능한 일", `<p>올해 <b>국제교류프로그램</b>도 선생님이 직접 신청해서 학생들과 함께 <b>몽골</b>에 다녀왔습니다.</p>
<p><b>융합페임랩</b>에는 신청자가 너무 많았습니다. 그래도 지원자를 떨어뜨리지 않고, 준비된 학생 거의 모두가 참여하도록 <b>1학기와 2학기로 나누어</b> 운영했어요.</p>
<p><b>3학년</b>은 1학기에 마쳐야 해서 <b>학생주도 스피치 발표회</b>를 따로 만들어 함께 참여했습니다.</p>`],
  ["4. 시설 및 분위기", 26, "8학급이라서 가능한 일", `<p>사실 <b>여덟 학급</b>이라서 학생들이 좀 더 <b>눈에 잘 들어와서</b> 가능한 일이지 않을까 싶구요,</p>
<p><b>서로 이끌어 주며 함께 성장하는 것</b>이야말로 어떤 프로그램보다 소중한 <b>풍산고의 장점</b>이라고 생각합니다.</p>`],

  ["QnA", 27, "QnA", `<p>다음으로, 설명회를 신청하시면서 남겨 주신 <b>궁금한 점</b>을 살펴봤습니다.</p>
<p>가장 많이 궁금해하신 것은 <b>교육과정과 과목 선택</b>, 그리고 <b>진학</b>과 관련된 내용이었습니다. 이 부분은 뒤에서 <b>각 부장님들께서</b> 자세히 설명해 주실 예정입니다.</p>`],
  ["QnA", 27, "QnA", `<p><b>'학생 수가 적어서 불리하지 않나요?'</b>라는 질문도 많으셨습니다.</p>
<p>앞서 재학생의 발표에서도 들으셨다시피, <b>5등급제</b>가 되고 <b>고교학점제</b>가 시행되면서 학생들이 <b>과목을 선택해서</b> 듣게 되었습니다.</p>
<p>그러다 보니 오히려 학생 수 때문에 불리하다는 것 자체가 <b>애매한 말이 돼 버린</b> 것 같아요.</p>`],
  ["QnA", 27, "QnA", `<p><b>동아리와 야간자율학습</b>에 대한 질문도 많으셨습니다.</p>
<p>풍산고의 동아리는 학생들이 <b>직접 동아리를 만들고, 구성하고, 인원을 모집해서 1년 동안</b> 활동하는 방식으로 운영됩니다.</p>
<p>야간자율학습은 <b>희망하는 학생에 한해</b> 운영하고 있습니다.</p>
<p>이 밖에 궁금하신 점은 <b>QnA 시간</b>에 편하게 질문해 주세요.</p>`],

  ["원서 접수 안내", 28, "원서 접수 – 청아고", `<p>마지막으로 <b>2027학년도 신입생 원서 접수 안내</b>입니다.</p>
<p>먼저 <b>청아고</b>는 <b>12학급, 학급당 26명, 총 312명</b>을 모집합니다.</p>
<p>접수 기간과 방법, 합격자 발표는 <b>풍산고와 동일</b>하기 때문에 <b>다음 슬라이드</b>에서 말씀드리겠습니다.</p>`],
  ["원서 접수 안내", 29, "원서 접수 – 풍산고", `<p><b>풍산고</b>는 <b>8학급, 학급당 28명, 총 224명</b>을 모집합니다.</p>
<p>원서는 <b>12월 4일 금요일부터 10일 목요일 오후 5시까지</b>, 재학생과 졸업생은 <b>출신 중학교</b>에서 접수하시면 됩니다.</p>
<p><b>검정고시 출신자와 특례입학전형 지원자</b>는 <b>풍산고 2층 제1교무실</b>에서 접수합니다.</p>`],
  ["원서 접수 안내", 29, "원서 접수 – 풍산고", `<p>접수에 대한 자세한 사항은 추후 <b>학교 홈페이지</b>에서 다시 안내드릴 예정입니다.</p>
<p>합격자는 <b>12월 14일 월요일 이내</b>에 <b>풍산고등학교 홈페이지</b>에서 발표합니다.</p>`],

  ["마무리", 29, "마무리", `<p>풍산고는 <b>'나의 배움이 모두에게 나눔이 되는 학교'</b>입니다.</p>
<p><b>한 명도 놓치지 않고 함께 성장하는 학교</b>로서, <b>학생들의 소중한 꿈이 현실이 될 수 있도록</b> 돕겠습니다.</p>
<p>오늘 이야기가 여러분의 선택에 도움이 되었으면 합니다. <b>경청해 주셔서 감사합니다.</b></p>`],
];

const $ = id => document.getElementById(id);
const store = {
  get(k, d) { try { const v = localStorage.getItem("pp_" + k); return v === null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem("pp_" + k, JSON.stringify(v)); } catch (e) {} }
};
let i = Math.max(0, Math.min(store.get("i", 0), S.length - 1));
let fs = store.get("fs", window.innerWidth < 700 ? 26 : 44);
if (store.get("dark", false)) document.body.classList.add("dark");

const plain = h => h.replace(/<[^>]+>/g, "").replace(/\s+/g, " ").trim();

function render() {
  const [sec, no, title, html] = S[i];
  $("sec").textContent = sec;
  $("slide").textContent = `🖥 ${no}. ${title}`;
  $("count").textContent = `${i + 1} / ${S.length}`;
  $("text").innerHTML = html;
  $("text").classList.remove("reveal");
  $("bar").style.width = ((i + 1) / S.length * 100) + "%";
  $("main").scrollTop = 0;
  const n = S[i + 1];
  if (!n) $("next").innerHTML = `<span>끝</span>수고하셨습니다!`;
  else if (n[1] !== no) $("next").innerHTML = `<span class="click">🖱 클릭 → ${n[1]}. ${n[2]}</span>${plain(n[3])}`;
  else $("next").innerHTML = `<span>다음 ▸</span>${plain(n[3])}`;
  document.documentElement.style.setProperty("--fs", fs + "px");
  store.set("i", i);
}
function go(d) { i = Math.max(0, Math.min(S.length - 1, i + d)); render(); }

// 목차
function buildToc() {
  let h = `<button id="tocClose">✕ 닫기</button>`, last = "";
  S.forEach(([sec, no, title, html], k) => {
    const top = sec.split(" – ")[0];
    if (top !== last) { h += `<h2>${top}</h2>`; last = top; }
    h += `<button class="item${k === i ? " cur" : ""}" data-k="${k}"><span class="n">🖥${no}</span>${plain(html)}</button>`;
  });
  $("toc").innerHTML = h;
}
$("btnToc").onclick = () => { buildToc(); $("toc").classList.add("open"); };
$("toc").onclick = e => {
  const t = e.target.closest("button"); if (!t) return;
  if (t.dataset.k !== undefined) { i = +t.dataset.k; render(); }
  $("toc").classList.remove("open");
};

function toggleHide() {
  document.body.classList.toggle("hide");
  $("btnHide").classList.toggle("on", document.body.classList.contains("hide"));
}
$("btnHide").onclick = toggleHide;
$("btnSmall").onclick = () => { fs = Math.max(16, fs - 4); store.set("fs", fs); render(); };
$("btnBig").onclick = () => { fs = Math.min(110, fs + 4); store.set("fs", fs); render(); };
$("btnTheme").onclick = () => { document.body.classList.toggle("dark"); store.set("dark", document.body.classList.contains("dark")); };

// 키보드
document.addEventListener("keydown", e => {
  if ($("toc").classList.contains("open")) { if (e.key === "Escape") $("toc").classList.remove("open"); return; }
  if (["ArrowRight", "ArrowDown", "PageDown", " ", "Enter"].includes(e.key)) { e.preventDefault(); go(1); }
  else if (["ArrowLeft", "ArrowUp", "PageUp", "Backspace"].includes(e.key)) { e.preventDefault(); go(-1); }
  else if (e.key === "h" || e.key === "H" || e.key === "ㅗ") toggleHide();
  else if (e.key === "Home") { i = 0; render(); }
  else if (e.key === "End") { i = S.length - 1; render(); }
});

// 화면: 가리기 중엔 누르고 있으면 보기 / 아니면 좌우 탭·스와이프로 이동
let sx = 0, sy = 0, held = false;
$("main").addEventListener("pointerdown", e => {
  sx = e.clientX; sy = e.clientY;
  if (document.body.classList.contains("hide")) { held = true; $("text").classList.add("reveal"); }
});
window.addEventListener("pointerup", e => {
  const dx = e.clientX - sx, dy = e.clientY - sy;
  if (held) { held = false; $("text").classList.remove("reveal"); }
  if (e.target.closest("header, #toc, .next")) return;
  if (Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy)) { go(dx < 0 ? 1 : -1); return; }
  if (!document.body.classList.contains("hide") && Math.abs(dx) < 10 && Math.abs(dy) < 10 && e.target.closest("main")) {
    go(e.clientX > window.innerWidth / 2 ? 1 : -1);
  }
});

render();
</script>
</body>
</html>
